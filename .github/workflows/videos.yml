# 유튜브 채널의 영상과 재생목록을 하루 한 번 가져와 data/videos.json 에 저장합니다.
name: videos

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 한국 시간 새벽 3시 17분
  workflow_dispatch:         # 관리자 모드의 "지금 새로 가져오기" 버튼

permissions:
  contents: write
  pages: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp
      - name: Fetch videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/fetch_videos.py
      - name: Save if changed
        id: save
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "영상 목록 갱신"
            git pull --rebase
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild site
        if: steps.save.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
